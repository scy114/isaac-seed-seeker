<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>爽种校准台</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">DAILY-GOOD-V0 · 调试页面</p>
        <h1>爽种校准台</h1>
        <p>批量看开局、凭直觉投票。这里会剧透全部结果。</p>
      </header>

      <section class="toolbar">
        <label>起始日期 <input id="start-date" type="date" value="2026-01-01"></label>
        <label>样本数
          <select id="days">
            <option value="10">10 天</option>
            <option value="30" selected>30 天</option>
            <option value="100">100 天</option>
          </select>
        </label>
        <button id="generate" type="button">生成样本</button>
        <span id="status">每天固定扫描 1000 万候选</span>
      </section>

      <section id="summary" class="summary" hidden>
        <div><strong id="summary-total">0</strong><span>样本</span></div>
        <div><strong id="summary-good">0</strong><span>爽</span></div>
        <div><strong id="summary-neutral">0</strong><span>一般</span></div>
        <div><strong id="summary-bad">0</strong><span>不爽</span></div>
        <div><strong id="summary-pending">0</strong><span>未审核</span></div>
        <div><strong id="summary-weight">0</strong><span>平均权重</span></div>
      </section>

      <section id="review-tools" class="review-tools" hidden>
        <div class="filters" id="filters">
          <button class="active" data-filter="all">全部</button>
          <button data-filter="pending">未审核</button>
          <button data-filter="good">爽</button>
          <button data-filter="neutral">一般</button>
          <button data-filter="bad">不爽</button>
        </div>
        <button id="export" type="button">导出审核 JSON</button>
      </section>

      <section id="results" class="results"></section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
