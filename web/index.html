<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Isaac Seed Seeker</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">THE BINDING OF ISAAC · EDEN</p>
        <h1>Isaac Seed Seeker</h1>
        <p class="lead">在本机离线扫描伊甸开局。没有上传，没有 Python 运行时。</p>
      </div>
      <div class="profile-card">
        <span>默认 Profile</span>
        <strong id="profile-name">正在读取…</strong>
        <small id="profile-detail"></small>
      </div>
    </header>

    <section class="panel form-panel">
      <div class="section-title">
        <div>
          <p class="step">01 · 筛选条件</p>
          <h2>伊甸开局组合</h2>
        </div>
        <span class="logic">饰品 AND 主动组 AND 被动组</span>
      </div>
      <form id="search-form">
        <label>
          <span>饰品 ID</span>
          <input id="trinket-id" inputmode="numeric" value="169" required>
          <small>普通与金色饰品按基础 ID 匹配</small>
        </label>
        <label>
          <span>主动道具（任意一个）</span>
          <input id="active-ids" value="145, 133" required>
          <small>使用逗号分隔多个 ID</small>
        </label>
        <label>
          <span>被动道具（任意一个）</span>
          <input id="passive-ids" value="81, 134, 187, 212, 665" required>
          <small>组内 OR，三组条件之间 AND</small>
        </label>
        <details>
          <summary>扫描范围与线程</summary>
          <div class="advanced-grid">
            <label><span>起点</span><input id="range-start" value="1"></label>
            <label><span>终点</span><input id="range-end" value="4294967295"></label>
            <label><span>线程</span><input id="threads" value="8"></label>
          </div>
        </details>
        <div class="actions">
          <button class="primary" id="start-button" type="submit">扫描全部种子</button>
          <button class="secondary" id="cancel-button" type="button" disabled>停止</button>
        </div>
      </form>
    </section>

    <section class="panel progress-panel">
      <div class="section-title compact">
        <div>
          <p class="step">02 · 搜索状态</p>
          <h2 id="state-label">等待开始</h2>
        </div>
        <strong id="percent-label">0.00%</strong>
      </div>
      <div class="progress-track"><div id="progress-bar"></div></div>
      <div class="metrics">
        <div><span>已扫描</span><strong id="scanned-value">0</strong></div>
        <div><span>命中</span><strong id="matches-value">0</strong></div>
        <div><span>耗时</span><strong id="elapsed-value">0.0 秒</strong></div>
        <div><span>速度</span><strong id="speed-value">—</strong></div>
      </div>
      <p class="error" id="error-message" hidden></p>
    </section>

    <section class="panel results-panel">
      <div class="section-title compact">
        <div>
          <p class="step">03 · 结果</p>
          <h2>候选种子</h2>
        </div>
        <a class="download disabled" id="download-link" href="/api/v1/search/results.txt" download>导出 TXT</a>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>种子</th><th>uint32</th><th>饰品</th><th>主动</th><th>被动</th></tr></thead>
          <tbody id="results-body"><tr><td colspan="5" class="empty">完成搜索后在这里显示结果</td></tr></tbody>
        </table>
      </div>
    </section>

    <footer>
      <span>计算只发生在你的电脑上</span>
      <button id="shutdown-button" type="button">关闭本地程序</button>
    </footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
